version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/El_Salvador"
    # Pausar PR de versiones para mantener las dos ramas activas acordadas.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/El_Salvador"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
