name: CI

on:
  push:
    branches: [main, feature/desarrollo]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore GoDental.sln

      - name: Build
        run: dotnet build GoDental.sln -c Release --no-restore

      - name: Test
        run: dotnet test GoDental.sln -c Release --no-build --no-restore --collect:"XPlat Code Coverage" --logger "trx;LogFileName=godental-tests.trx" --results-directory TestResults

      - name: Inventario sobre SQL Server aislado
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/GoDental.DatabaseTests -c Release --no-build -- --run-inventory --localdb .

      - name: Devoluciones y anulaciones sobre SQL Server aislado
        run: dotnet run --project tests/GoDental.DatabaseTests -c Release --no-build -- --run-returns --localdb .

      - name: Seguridad y catálogo sobre SQL Server aislado
        run: dotnet run --project tests/GoDental.DatabaseTests -c Release --no-build -- --run-integration --localdb .

      - name: Conteos físicos sobre SQL Server aislado
        run: dotnet run --project tests/GoDental.DatabaseTests -c Release --no-build -- --run-counts --localdb .

      - name: Proveedores sobre SQL Server aislado
        run: dotnet run --project tests/GoDental.DatabaseTests -c Release --no-build -- --run-suppliers --localdb .

      - name: Clientes sobre SQL Server aislado
        run: dotnet run --project tests/GoDental.DatabaseTests -c Release --no-build -- --run-customers --localdb .

      - name: Ventas, caja, crédito y entregas sobre SQL Server aislado
        run: dotnet run --project tests/GoDental.DatabaseTests -c Release --no-build -- --run-mvp --localdb .

      - name: Códigos automáticos sobre SQL Server aislado
        run: dotnet run --project tests/GoDental.DatabaseTests -c Release --no-build -- --run-codes --localdb .

      - name: Recuperación de operaciones y reinicio aislados
        run: dotnet run --project tests/GoDental.DatabaseTests -c Release --no-build -- --run-recovery --localdb .

      - name: Complementos comerciales sobre SQL Server aislado
        run: dotnet run --project tests/GoDental.DatabaseTests -c Release --no-build -- --run-complements --localdb .

      - name: Compras y recepciones sobre SQL Server aislado
        run: dotnet run --project tests/GoDental.DatabaseTests -c Release --no-build -- --run-purchases --localdb .

      - name: Importaciones y costeo sobre SQL Server aislado
        run: dotnet run --project tests/GoDental.DatabaseTests -c Release --no-build -- --run-imports --localdb .

      - name: Smoke WPF y vistas
        run: dotnet run --project tests/GoDental.SmokeTests -c Release --no-build -- TestResults/UiPreviews

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 14

