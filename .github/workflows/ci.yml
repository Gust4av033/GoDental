name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GoDental.sln

      - name: Build
        run: dotnet build GoDental.sln -c Release --no-restore

      - name: Test
        run: dotnet test GoDental.sln -c Release --no-build --no-restore --collect:"XPlat Code Coverage"
